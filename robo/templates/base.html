<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if chave_extensao %}<meta name="radar-chave" content="{{ chave_extensao }}">{% endif %}
<title>{% block titulo %}Radar de passagens{% endblock %}</title>
<style>
:root{--fundo:#f4f6f9;--cartao:#fff;--texto:#16202e;--suave:#5d6b7e;--borda:#dde3ea;--marca:#0b63ce;--marca-texto:#fff;--bom:#0f7a4a;--bom-fundo:#e3f5ec;--alerta:#9a5b00;--erro:#b3261e;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root{--fundo:#10151c;--cartao:#19212b;--texto:#e8edf3;--suave:#9aa7b8;--borda:#2b3644;--marca:#5aa2ff;--marca-texto:#08121f;--bom:#5fd39a;--bom-fundo:#143325;--alerta:#f0b45a;--erro:#ff8a80;--chip:#232e3b}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--marca)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;max-width:1040px;margin:0 auto}
header a.logo{font-weight:700;text-decoration:none;color:var(--texto);font-size:18px}
main{max-width:1040px;margin:0 auto;padding:0 16px 48px}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:20px;margin-bottom:20px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
.suave{color:var(--suave)}.pequeno{font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input[type=text],input[type=password],input[type=month]{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:10px;background:var(--fundo);color:var(--texto);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
button,.botao{display:inline-block;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--marca);color:var(--marca-texto);text-decoration:none}
button.liso{background:none;color:var(--suave);padding:6px 8px;font-weight:500}
.botao.fino{padding:6px 12px;font-size:14px;white-space:nowrap;margin:0 4px 6px 0}
.botao.borda{background:none;color:var(--marca);border:1px solid var(--borda)}
.erro{color:var(--erro);font-weight:600;margin:0 0 14px}
.grade{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcoes label{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;margin:0;padding:9px 12px;border:1px solid var(--borda);border-radius:10px;cursor:pointer}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0;white-space:nowrap}
.chip a{text-decoration:none}
.chip.bom{background:var(--bom-fundo);color:var(--bom);font-weight:600}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--suave);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--borda);vertical-align:top}
tr.melhor td{background:var(--bom-fundo)}
.preco{font-weight:700;font-size:17px;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <a class="logo" href="{{ url_for('inicio') }}">✈ Radar de passagens</a>
  {% if session.usuario %}<form method="post" action="{{ url_for('sair') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><span class="suave pequeno">{{ session.usuario }}</span> <button class="liso">Sair</button></form>{% endif %}
</header>
<main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
