{% extends "base.html" %}
{% block conteudo %}
<div class="cartao" style="max-width:380px;margin:8vh auto 0">
  <h1>Entrar</h1>
  <p class="suave pequeno">Use o usuário e a senha que você criou na instalação.</p>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <p><label for="usuario">Usuário</label><input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus></p>
    <p><label for="senha">Senha</label><input type="password" id="senha" name="senha" autocomplete="current-password" required></p>
    <button>Entrar</button>
  </form>
</div>
{% endblock %}
